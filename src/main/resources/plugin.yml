name: NinjaArena
version: '${version}'
main: com.ninja6.ninjaarena.NinjaArenaPlugin
api-version: '26.3'
author: Ninja6-MC
description: Team vs Team vs Enemies arena with ninja stealth mechanics.

# Paper only. Folia refuses to enable a plugin that does not declare support, and this one
# deliberately does not.
folia-supported: false
softdepend: [PlaceholderAPI, Vault, Geyser-Spigot, floodgate]

commands:
  # The long name is the registered root and the short one an alias, so a collision on the
  # alias costs only the short form.
  ninjaarena:
    description: The Arena commands
    usage: /<command>
    aliases: [narena]
    permission: ninjaarena.play;ninjaarena.host;ninjaarena.admin;ninjaarena.admin.lobby;ninjaarena.spectate;ninjaarena.leaderboard;ninjaarena.event.manage

permissions:
  # Each tier is a declared child of the one above it. Bukkit gives the dots in a node name
  # no meaning, so the inheritance exists only where it is written out.
  ninjaarena.shop.use:
    description: Buy round upgrades with personal points.
    default: true
    children: {}
  ninjaarena.play:
    description: Join and play arena matches
    default: true
    children:
      ninjaarena.shop.use: true
      ninjaarena.spectate: true
      ninjaarena.leaderboard: true
      ninjaarena.rewards.payout: true
      ninjaarena.room.create: true
  ninjaarena.room.create:
    description: Open a room and be handed one when its host leaves
    default: true
    children: {}
  ninjaarena.rewards.payout:
    description: Receive enabled Vault match payouts
    default: true
    children: {}
  ninjaarena.leaderboard:
    description: View Arena leaderboards
    default: true
    children: {}
  ninjaarena.spectate:
    description: Watch live arena matches
    default: true
    children: {}
  ninjaarena.host:
    description: Host and run arena matches
    default: op
    children:
      ninjaarena.play: true
  ninjaarena.event.manage:
    description: Manage scheduled Arena events
    default: op
    children: {}
  ninjaarena.admin:
    description: Administer the Arena
    default: op
    children:
      ninjaarena.host: true
      ninjaarena.event.manage: true
      ninjaarena.map.change: true
      ninjaarena.admin.lobby: true
  ninjaarena.map.change:
    description: Change the map of a hosted room
    default: op
    children: {}
  ninjaarena.admin.lobby:
    description: Edit the lobby and reset it to the bundled build
    default: op
    children: {}
