# NinjaArena player messages: the text the plugin shows to players and admins, so it can
# be reworded or translated. /ninjaarena admin reload reads this file again.
#
# A few things are not here. Command argument syntax and argument names, such as create
# <name> [<cell x> <cell z>] or x1, are filled in as <usage> and <what>. Names of arenas,
# portals, worlds, files and config.yml settings are filled in as they are. Errors from
# the system itself, such as a file or database failure or a YAML parse error, are filled
# in as <reason>. The reasons /ninjaarena admin reload gives for rejecting config.yml or
# kits.yml are configuration diagnostics, also written to the server log, and stay in
# English.
#
# Format: MiniMessage, https://docs.advntr.dev/minimessage/format.html. Colours and styles
# are tags such as <red>, <gold>, <bold> or <#ff8800>; </red> ends one early. Keep each
# text in double quotes; to show a literal tag, write it with a doubled backslash:
# \\<player>.
#
# Placeholders are named tags, such as <arena>, <player> or <seconds>. A text can use the
# placeholders its default uses, in any order or not at all; any other name counts as an
# unreadable tag. Player names and other typed input are inserted as plain text, so they
# can never add formatting or click actions.
#
# A text that is missing, is not text (a list, say) or uses a tag MiniMessage cannot read
# falls back to the bundled default, with one warning in the server log per key. A key
# this version does not know is ignored, with a warning. Startup and reload read the file
# the same way.
#
# Some texts are passed on as plain text: menu and dialog items, kick screens, entry
# refusals, reload reports and the Discord webhook. Formatting tags in those are removed;
# the sections below say which. Delete this file to get the defaults back on the next
# start.

# Shared by several features.
common:
  restore-failed: "<red>Your belongings could not be returned yet. Rejoin the server, or ask an admin if this keeps happening."

# /ninjaarena itself. <label> is the command as typed, <usage> its arguments.
command:
  no-permission: "<red>You do not have permission to use this command."
  players-only: "<red>Only players can use this Arena command."
  leave-players-only: "<red>Only players can leave an arena."
  not-in-arena: "<red>You are not in an arena."
  usage: "<red>Usage: /<label> <usage>"
  unknown: "<red>Unknown command <command>. Available commands:"
  help-header: "<gold>The Arena commands:"
  help-line: "<yellow>/<label> <usage></yellow><gray> - <description>"
  unavailable: "<yellow><feature> is not available yet in the Arena."
  invalid-player-id: "<red><reason>. Usage: /<label> <usage>"
  feature:
    textures: "Texture quality"
    reload: "Configuration reload"
    lobby: "Lobby editing"
    rooms: "Rooms"
    shop: "The shop"
  usage-full: "<red>Usage: <usage>"
  unknown-subcommand: "<red>Unknown subcommand <subcommand>. Use one of: <subcommands>."
  error: "<red><message>"
  warning: "<yellow><message>"
  failed: "<reason>"
  player-id:
    xuid: "A Bedrock XUID is 1 to 20 digits"
    xuid-required: "A Bedrock XUID is required"
