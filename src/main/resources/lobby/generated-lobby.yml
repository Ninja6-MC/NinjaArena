# The pieces the generated lobby is assembled from, one structure file each in pieces/.
# They were taken from the eight-pad reference build in the lobby_design test world
# (x -71..-41, y 88..103, z -41..-11) and are placed by GeneratedLobby, which sizes the
# lobby to arenas.max-active.
#
# This file is the source of every lobby/pieces/<name>.nbt. After changing a piece, run
#
#     ./gradlew generateLobbyPieces
#
# and commit this file with the structures; LobbyPiecesTest fails while they disagree.
#
# Each piece lists its layers from the bottom up. A layer's rows run north to south and
# each row west to east, one palette letter per block; "." is left as it is. Entities
# stand at piece-relative positions; yaw 0 faces south.
#
# floor      the lobby floor wherever no other piece is
# wall       one column of the edge, standing on the floor ring
# centre     the middle square: stone under green wool with the emblem. A larger lobby
#            draws the emblem at a whole-number scale on a larger square.
# pad        one room pad: a 5 x 5 diamond plate in a gold frame. Neighbouring pads share
#            a frame line.
# corner-*   the corner squares, with their log floor, wool slabs and cushions
# tree-*     the tree variants that stand on the edge posts, trunk at the middle column
#            and from the block above the floor. Each post's tree is picked from them
#            with a seeded random, so a layout is repeatable.

data-version: 5023

palette:
  "#": barrier
  "k": black_wool
  "D": diamond_block
  "G": gold_block
  "g": green_wool
  "v": green_wool_slab
  "L": pale_oak_log
  "*": shroomlight
  "s": stone
  "|": warped_stem
  "h": warped_wart_block
  "w": white_wool_slab

