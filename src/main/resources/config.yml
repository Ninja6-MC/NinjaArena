resource-pack:
  # Delivery and custom tool artwork are opt-in. Invalid enabled settings turn delivery
  # off at startup with an operator error; they never cause a player prompt loop.
  enabled: false
  # Java kicks on decline/failure. Bedrock held models also need Geyser enforcement.
  required: true
  # Live-reloadable flight fallback. All other resource-pack keys require a restart.
  thrown-visuals: true
  timeout-seconds: 120
  # Direct HTTPS ZIP URL, its 40-character SHA-1 and a UUID owned by this plugin.
  # Keep identity stable between versions; change URL and hash when the ZIP changes.
  url: ''
  sha1: ''
  id: ''
  # Optional Detailed overlay. Configure all three together. Players opt in with
  # /ninjaarena textures; it is never sent otherwise and is never required.
  detailed:
    url: ''
    sha1: ''
    id: ''
  # Same-server Geyser-Spigot hook. Restart after changing any of these settings.
  bedrock:
    # Confirm matching mappings are installed in Geyser. Its public API cannot query
    # loaded mappings after startup. This asserts installation only, never enforcement.
    mappings-installed: false
    # Copy pinned release files into the NinjaArena data folder, outside Geyser's packs folder.
    standard:
      file: ''
      sha256: ''
    detailed:
      file: ''
      sha256: ''

arena-world:
  # Hard gameplay diameter in blocks (16..2048), centred on 0, 0. Bounds and visits
  # must fit inside it, so a continuously busy non-saving world has a finite footprint.
  border-size: 2048
  # Chunk radius sent to players in the arena world (2 to 32).
  view-distance: 6
  # Chunk radius around players where entities and blocks tick (2 to 32).
  simulation-distance: 4

arena-grid:
  # Edge of the square grid cell each arena is built in, in blocks. Rounded down to a
  # multiple of 16 (32 to 4096) so cells line up with chunks. Cells must lie inside the
  # world border; changing this moves every cell, so set it before the first arena.
  cell-size: 256

waiting-room:
  # Where portals send players before their match, for every portal that does not choose
  # for itself with /narena portal lobby (player-built portals never do; see player-portals):
  #   dedicated - the waiting room of the portal's own arena. The match there starts once
  #               enough players have arrived; when it is full, more are turned away.
  #   shared    - one hub for every portal, set with /narena portal sethub. Once enough
  #               players are there, the first to arrive go together to a free arena's
  #               teams; the rest wait in the hub for the next free arena.
  lobby: dedicated
  # Players needed in a waiting room or the hub before the start countdown begins (1 to 64),
  # or fewer for an arena that holds fewer. Arriving players are put on the smallest team.
  min-players: 2
  # The most players one match takes (0 for no limit, otherwise min-players to 256). A full
  # waiting room turns arrivals away; the hub keeps them for the next arena.
  max-players: 0
  # The most players on one team (0 for no limit, otherwise 1 to 64). An arena then takes at
  # most this many times its team count. An arena that holds fewer than min-players starts
  # once it is full, whether its players wait in its room or in the hub.
  team-size: 0
  # Length of the start countdown in seconds (1 to 600). It stops if the count drops below
  # min-players and starts again from the full length when it is reached again.
  countdown-seconds: 30
  # How far a player may move from the waiting-room or hub point, in blocks along any axis
  # (2 to 64). Going further, or being teleported further, sends them home.
  radius: 16

player-portals:
  # Players with ninjaarena.play build their own way in: a frame of frame-material shaped
  # like a nether portal (an opening 2 to 21 wide and 3 to 21 tall, corners optional), lit
  # with flint and steel. It leads where waiting-room.lobby says: the shared hub, or a
  # waiting room that is filling, else a free arena, else the player is told every arena is
  # busy. Changes apply to the next portal lit; portals already built stay until a frame
  # block breaks or an admin deletes them with /narena portal delete.
  # Worlds players may build in, by name. An empty list turns building off. The arena world
  # is never allowed.
  worlds:
    - world
  # The frame block: any solid block except obsidian, which belongs to nether portals.
  # Each portal keeps the block it was built from.
  frame-material: crying_obsidian
  # Portals one player may own at once (0 for no limit, otherwise 1 to 1000).
  max-per-player: 2
  # Least distance between the centre of a new portal and that of any other portal in the
  # same world, in blocks (0 to 1024; 0 turns the check off).
  min-distance: 32
  # Colour of the particle curtain in the opening, as #RRGGBB. Java and Bedrock players see
  # it without a resource pack.
  color: '#40E0D0'

match:
  # Allow damage and harmful splash/cloud effects between teammates in the same match.
  friendly-fire: false
  # Every value below is in seconds unless it says otherwise.
  # Prep at the team spawns at the start of each round: no damage, no enemies (1 to 3600).
  prep-seconds: 15
  # The round timer: how long a round is fought before it goes to Overrun (1 to 3600).
  round-seconds: 240
  # Overrun runs at maximum intensity until one team is left. When this many seconds pass
  # first, the round ends as a draw. 0 means no limit (0 to 3600).
  overrun-limit-seconds: 120
  # Pause after a round is decided, before the next one starts (1 to 3600).
  round-end-seconds: 5
  # How long the result is shown before every player is sent home (1 to 3600).
  match-end-seconds: 10
  # Rounds in a match (1 to 25).
  rounds: 5
  # Extra rounds played, one at a time, while the lead is tied after the last round. Still
  # tied after them, the leading teams share the win (0 to 10).
  extra-rounds: 1

scoring:
  # Points awarded to the winning team of a round. Draws award nothing; 0 disables it.
  round-win-points: 5
  # Points for killing an opposing player in the same match. Teamkills, suicides,
  # environmental deaths and leaving award nothing. 0 disables this award.
  player-kill-points: 2

stability:
  # Matches running at once (1 to 100). A waiting room whose countdown ends while this many
  # run holds at its last second until one finishes.
  max-concurrent-matches: 4
  # Enemies alive at once in one match, and across every match (1 to 1000 each).
  match-mob-cap: 25
  global-mob-cap: 80
  # Enemies spawned in one server tick across every match (1 to 100). A director held back
  # by a cap or this limit tries again the next second.
  spawns-per-tick: 4
  # Tick-time guard, on the server's average tick time in milliseconds (1 to 1000). Above
  # pause-spawning-above-mspt no enemies spawn; above drop-tier-above-mspt the intensity is
  # also lowered by intensity-tier (0 to 1). Both last until the average falls below
  # resume-below-mspt. Resume is kept at or below pause, and drop-tier at or above it.
  pause-spawning-above-mspt: 40.0
  drop-tier-above-mspt: 45.0
  resume-below-mspt: 35.0
  intensity-tier: 0.25
  # After a tier drop, spawning resumes below resume-below-mspt but the intensity stays a
  # tier lower for this many seconds (0 to 600), so the arenas refill to less than before.
  tier-recovery-seconds: 30

director:
  # Log why an enemy did not spawn (each reason at most once per round per match) at INFO
  # rather than FINE, which the default server log leaves out. /narena director shows the
  # latest reason either way.
  debug: false
  spawn:
    # An enemy spawn point is used only when it is in loaded chunks, has room for the enemy,
    # is more than 8 blocks from every player of the match still alive in the round, and is
    # hidden from each of them: out of their line of sight, or more than view-angle degrees
    # off the way they look (0 to 180). 180 leaves only cover to hide a point. Spectators and
    # players outside the match do not count.
    view-angle: 100.0
  threat-budget:
    # Budget per round = base x round multiplier x player factor: the threat allowed alive
    # at intensity 1. The multiplier and factor are set under director.intensity.
    # Negative values count as zero; base and factors must be finite. No rounding is applied.
    base: 20.0
  enemy-costs:
    # Threat points per enemy (minimum 1).
    zombie: 1
    skeleton: 2
    spider: 2
    shadow-stalker: 8
  stealth:
    # A hidden player is one who crouches where no enemy can see them, or crouches in low
    # light. Their targeting weight is multiplied by hidden-weight (0 to 1); 1 turns it off.
    hidden-weight: 0.25
    # Light level at or below which a crouching player is hidden even in plain sight (-1 to
    # 15); -1 turns it off.
    low-light: 7
    # Seconds an enemy chases a player it cannot see before it loses track of them and goes
    # for another (1 to 60). Checked once a second.
    lose-track-seconds: 3
    # Targeting weight multiplier of a player marked by a shuriken (1 to 10); 1 turns it off.
    # The hidden cut, the mark and the leader bias all multiply together. Enemies inside a
    # smoke bomb cloud drop their target and take no other while inside.
    marked-weight: 2.0
    # Enemy types that skip the hidden cut and the lose-track timer. The Shadow Stalker is
    # the one enemy stealth does not fool.
    ignores-stealth:
      zombie: false
      skeleton: false
      spider: false
      shadow-stalker: true
  shadow-stalker:
    # The signature enemy: a wither skeleton, resized and armed through attributes and
    # equipment only, so Java and Bedrock players see it without a resource pack. Its cost is
    # director.enemy-costs.shadow-stalker; killing one scores that many points.
    # Stalkers alive at once in one match (0 to 5); 0 turns the Shadow Stalker off.
    max-alive: 1
    # Health in half hearts (1 to 1024).
    health: 40.0
    # Melee damage per hit in half hearts, before armour (0 to 100). Its sword adds nothing
    # and its hits do not wither.
    damage: 6.0
    # Movement speed attribute (0.1 to 0.5); vanilla wither skeletons use 0.25.
    speed: 0.3
    # Size multiplier (0.5 to 2). Spawn points need room for the larger body.
    scale: 1.1
    blink:
      # A target is out of reach at distance blocks or more (2 to 32), or nearer when no
      # walking path gets there. Within range blocks (4 to 64, at least distance) the
      # Stalker stands still for tell-ticks server ticks (5 to 100; 20 a second) with a
      # particle tell, then lands behind blocks behind the target (1 to 6), inside the arena.
      distance: 8.0
      range: 24.0
      tell-ticks: 20
      behind: 2.0
      # Seconds between blinks, and before the first one after spawning (1 to 120).
      cooldown-seconds: 8
    # How long the target glows after a blink (1 to 60).
    glow-seconds: 3
  intensity:
    # Once a second during a fight the director works out a target intensity from 0 to 1 and
    # spawns enemies until the cost of those alive reaches intensity x the round budget.
    # OVERRUN is always 1. Fractions are 0 to 1; non-finite values use the default.
    # Combat repeats a cycle: a build-up from the relax level to the round's peak, the peak
    # held, then a short relax. Lengths in seconds (1 to 600).
    build-up-seconds: 40
    peak-seconds: 20
    relax-seconds: 10
    # Peak intensity of round 1; each later round, extra rounds included, adds round-step.
    first-round-peak: 0.6
    round-step: 0.1
    # Relax intensity as a fraction of the round's peak.
    relax-level: 0.25
    # Intensity added by the end of the round timer, growing evenly through combat.
    time-ramp: 0.2
    # Share of the intensity that scales with the fraction of starting teams still alive in
    # the round. 0 ignores eliminations.
    teams-weight: 0.5
    # Damage taken by alive players over the last damage-window-seconds (1 to 60), divided by
    # the players alive, eases the pressure: at damage-full-stress half hearts per player (1
    # to 1000) the intensity is cut by damage-relief.
    damage-window-seconds: 10
    damage-full-stress: 20.0
    damage-relief: 0.5
    # The threat-budget round multiplier is 1 + budget-round-step x (round - 1), and its
    # player factor is budget-per-player x the players alive when the fight starts (both 0
    # to 10).
    budget-round-step: 0.25
    budget-per-player: 0.25
    # Targeting weight of players on the team with the most points (1 to 10); 1 turns the
    # leading-team pressure off. No team is favoured while every team has the same points.
    leader-bias: 2.0

tools:
  # The ninja kit tools. Which tools a player gets, and how many, is set by the kit in
  # kits.yml: leave a tool's entry out to turn it off. Tools work only in COMBAT and OVERRUN
  # for players still alive in the round.
  smoke-bomb:
    # How long the cloud lasts where the bomb lands (1 to 60).
    cloud-seconds: 4
    # Cloud radius in blocks (1 to 8).
    radius: 3.0
    # Blindness given to a rival player in the cloud, renewed while they stay in it (1 to
    # 60). Teammates, the thrower and anyone outside the match are never affected.
    blindness-seconds: 2
  shuriken:
    # Damage per hit in half hearts, before armour (0 to 20). Damage rules and friendly
    # fire apply as for any other attack.
    damage: 2.0
    # How long a rival hit by a shuriken glows and stays marked for enemies (1 to 60).
    glow-seconds: 3
  dash:
    # Time between dashes (1 to 60).
    cooldown-seconds: 8
    # Forward speed in blocks per tick (0.1 to 2). A dash is shortened so it ends inside
    # the arena.
    strength: 1.0
    # Upward speed in blocks per tick (0 to 0.6).
    lift: 0.3

# Lists of milestone and season placing rewards. See docs/player-stats.md for examples.
rewards:
  milestones: []
  placings: []
  vault:
    enabled: false
    amount-per-match: 10.0
    daily-cap: 100.0

placeholders:
  # Seconds to keep each snapshot before refreshing it on demand (1 to 300).
  cache-seconds: 30

stats:
  # Record each player's wins, rounds won, player kills, enemy kills, deaths, best Overrun
  # survival and matches played, all-time and per season. Written in the background once a
  # match ends; matches run the same when stats are off or the database is down. Restart to
  # change anything here except season. Players' texture quality choices use this same
  # storage in tables of their own and keep working when enabled is false.
  enabled: true
  # sqlite keeps a file in the plugin folder. mysql shares one MySQL or MariaDB database
  # between servers; give every server the same settings below.
  storage: sqlite
  # The current season, 1 to 64 characters. Changing it, here or by reload, archives the
  # current season and starts a new one; archived seasons keep their stats. A name an
  # archived season already has is refused and the current season stays.
  season: Season 1
  # Prepended to every table name: up to 24 lower-case letters, digits or underscores.
  table-prefix: ninjaarena_
  sqlite:
    # A plain file name inside the plugin folder.
    file: stats.db
  mysql:
    host: localhost
    # 1 to 65535.
    port: 3306
    database: ninjaarena
    username: ninjaarena
    password: ''

# Viewing a live match. Reloaded limits apply to new spectators.
spectating:
  enabled: true
  max-per-match: 16

# Weekly arena events are off until a schedule is configured. See docs/arena-events.md.
events:
  time-zone: UTC
  announcement-lead-minutes: [30, 10, 1]
  webhook-url: ''
  schedule: []
  messages:
    upcoming: 'Arena event {id} starts in {minutes} minute(s) at {arena}.'
    start: 'Arena event {id} has started at {arena}.'
